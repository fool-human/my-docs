# 网站名称（将显示在页面标题和导航栏）
site_name: 我的技术文档

# 网站描述，会写进生成页面的 meta description
site_description: 基于 MkDocs + Material 的技术文档示例

# 仓库地址，Material 主题会在右上角生成 "编辑此页" 链接
repo_url: https://github.com/
edit_uri: edit/main/docs/

# 使用 Material 主题（美观且支持响应式）
theme:
  name: material
  language: zh
  features:
    - navigation.sections
    - navigation.top
    - search.suggest
    - content.code.copy

# 网站导航结构（对应 docs 目录下的文件）
nav:
  - 首页: index.md
  - 关于: about.md
  - 指南: guide.md
  - API: api.md

# Markdown 扩展：代码高亮、表格、目录
markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
