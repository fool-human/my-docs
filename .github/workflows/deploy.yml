# 工作流名称（自定义）
name: Deploy MkDocs to GitHub Pages

# 触发条件
on:
  push:
    branches:
      - main            # 仅在 main 分支推送代码时触发
    paths:
      - 'docs/**'       # 仅当 docs 目录下文件变化时触发
      - 'mkdocs.yml'    # 仅当 MkDocs 配置文件变化时触发
  workflow_dispatch:    # 允许在 Actions 页面手动点 "Run workflow" 触发
    {}

# 同一个分支的多次推送只保留最新一次部署，避免并发写 gh-pages 分支冲突
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

# 最小权限原则：只给部署所需的 contents 写权限
permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest   # 运行环境：Ubuntu 最新版
    steps:
      # 步骤1：拉取 GitHub 仓库代码
      - name: 检出代码
        uses: actions/checkout@v4

      # 步骤2：配置 Python（MkDocs 依赖 Python）
      # 教程原文为 actions/setup-python@v4，这里升级到 v5；Python 3.9 已停止维护，
      # 且新版 mkdocs-material 要求 3.8+，本实验统一用 3.11 与项目 1 保持一致
      - name: 设置Python环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'   # 指定 Python 版本

      # 步骤3：安装依赖工具
      - name: 安装MkDocs及主题
        run: |
          python -m pip install --upgrade pip
          pip install mkdocs-material   # 安装 MkDocs 和 Material 主题
          mkdocs --version

      # 步骤4：生成静态网站文件
      - name: 构建静态文档
        run: |
          mkdocs build                  # 生成的文件存放在项目根目录的 site/ 文件夹
          ls -al site

      # 步骤5：将静态文件部署到 gh-pages 分支（GitHub Pages 默认读取该分支）
      - name: 部署到GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages   # 部署目标分支
          folder: site       # 待部署的文件目录（即步骤4生成的 site 目录）
          clean: true        # 部署前清空目标分支，避免残留旧文件
